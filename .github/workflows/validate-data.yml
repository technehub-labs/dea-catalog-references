name: Validate data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run invariants gate (validate-data.py)
        run: python3 scripts/validate-data.py

      - name: En-dash / em-dash sweep (D-004 cardinal rule)
        run: |
          if grep -rnP '[\x{2013}\x{2014}\x{2E3B}]' --include='*.md' --include='*.yml' --include='*.html' --include='*.py' --include='*.sh' --include='*.json' . ; then
            echo "FAILED: en-dash, em-dash, or triple-hyphen present in file contents" >&2; exit 1
          fi
          echo "OK: no en-dash, em-dash, or triple-hyphen found"

      - name: Semi-colon-trio sweep (D-005 cardinal rule)
        run: |
          matches=$(grep -rnF ';;;' --include='*.md' --include='*.html' --include='*.py' --include='*.sh' --include='*.json' --exclude-dir='.github' . || true)
          # Also exclude the validator/wave files themselves, which embed the literal triple-semicolon as data, not as prose
          if echo "$matches" | grep -v '^./scripts/validate-data.py:' | grep . ; then
            echo "FAILED: triple-semicolon present in non-script files" >&2; exit 1
          fi
          echo "OK: no triple-semicolon in source files"
